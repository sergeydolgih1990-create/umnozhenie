<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Рамка для снимков</title></head>
<body style="margin:0;background:#000;overflow:hidden">
<iframe id="f" style="border:0;display:block"></iframe>
<script>
  // Рамка точного размера: Edge без окна не сужается меньше 500 px, а телефону нужно 390
  const q = new URLSearchParams(location.search), f = document.getElementById('f');
  f.style.width = q.get('w') + 'px';
  f.style.height = q.get('h') + 'px';
  f.src = '../index.html?' + q.get('q');
</script>
</body>
</html>
