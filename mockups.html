<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блиц: макеты экранов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  body { margin: 0; background: #f3efe7; color: #1f2140; font-family: "Nunito", system-ui, sans-serif; font-weight: 700; }
  header { padding: 22px 16px 8px; max-width: 1280px; margin: 0 auto; }
  header h1 { margin: 0 0 6px; font-size: 28px; font-weight: 900; }
  header p { margin: 0 0 6px; color: #5f6388; max-width: 760px; line-height: 1.4; }
  #tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; padding: 10px 16px; background: rgba(243, 239, 231, .94); max-width: 1280px; margin: 0 auto; overflow-x: auto; }
  #tabs button { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 900; font-size: 15px; background: #fff; color: #1f2140; box-shadow: 0 3px 0 rgba(0, 0, 0, .1); white-space: nowrap; }
  #tabs button.on { background: #1f2140; color: #fff; }
  main { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
  section { margin-top: 22px; }
  section h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; }
  .note { margin: 0 0 12px; color: #5f6388; line-height: 1.4; }
  .frames { display: flex; flex-wrap: wrap; gap: 28px; }
  .frame { width: min(390px, 100%); }
  .cap { font-weight: 900; margin: 0 0 8px; color: #5f6388; }
  .fbox { width: 100%; position: relative; }
  .device { width: 390px; height: 844px; border-radius: 40px; overflow: hidden; transform-origin: top left; box-shadow: 0 0 0 8px #1f2140, 0 22px 50px rgba(0, 0, 0, .22); }
  .device > .app { width: 100%; height: 100%; }
  body[data-show="space"] [data-t]:not([data-t="space"]),
  body[data-show="dragon"] [data-t]:not([data-t="dragon"]),
  body[data-show="pirate"] [data-t]:not([data-t="pirate"]) { display: none; }
  .hrow h3 { margin: 14px 0 8px; font-size: 18px; font-weight: 900; }
  .hcards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .hcard { border-radius: 20px; padding: 10px 8px 12px; text-align: center; }
  .hcard svg.hero { width: 100%; height: auto; display: block; }
  .hc-name { font-weight: 900; font-size: 15px; margin-top: 4px; }
  .hc-title { font-weight: 800; font-size: 12px; color: var(--on-bg-soft); }
  @media (max-width: 640px) { .hcards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  body.solo { background: #fff; }
  body.solo header, body.solo #tabs { display: none; }
  body.solo main { padding: 0; max-width: none; }
  body.solo .device { border-radius: 0; box-shadow: none; }
  body.solo .sheet { padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>Блиц по таблице умножения — макеты</h1>
  <p>Оформление трёх тем до сборки логики: кнопки пока не нажимаются. Каждый игрок выбирает свою тему. Посмотрите раскладку, цвета и героев — что поменять, скажите до сборки.</p>
</header>
<nav id="tabs"><button class="on" data-t="all">Все темы</button><button data-t="space">Космос</button><button data-t="dragon">Драконы</button><button data-t="pirate">Пираты</button></nav>
<main id="root"></main>
<script src="js/themes.js"></script>
<script src="js/art.js"></script>
<script src="js/mockups.js"></script>
</body>
</html>
